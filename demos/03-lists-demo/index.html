<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lists Demo</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
      <ul>
        <li>This is a list item element</li>
        <li>strawberries</li>
        <li>chicken</li>
        <li>juice</li>
      </ul>
      This is text outside of the list.
      <ol>
        <li>These are more list items</li>
        <li>apples</li>
        <li>rice</li>
        <li>water</li>
      </ol>
    </body>
</html>
